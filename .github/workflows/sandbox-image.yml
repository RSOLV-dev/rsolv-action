# Builds and publishes the v5 sandbox image, ghcr.io/rsolv-dev/rsolv-sandbox (RFC-150 §1.1,
# ADR-077 §5): the Dockerfile's `sandbox` target, built and smoke-tested natively per
# architecture (no QEMU), then one multi-architecture index. The index digest in the job
# summary is what rsolv-host pins; nothing here pins or promotes it.
name: sandbox-image
on:
  push:
    tags: ["sandbox-v*"]
  workflow_dispatch:
permissions: {}
env:
  IMAGE: ghcr.io/rsolv-dev/rsolv-sandbox
jobs:
  build:
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, slug: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, slug: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: sandbox
          platforms: ${{ matrix.platform }}
          no-cache: true
          provenance: true
          labels: org.opencontainers.image.source=https://github.com/RSOLV-dev/RSOLV-action
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Non-root smoke test on this architecture
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          img="$IMAGE@$DIGEST"
          test "$(docker run --rm --user 1001:118 -e HOME=/opt/home "$img" id -u)" = 1001
          test "$(docker run --rm --user 1001:118 -e HOME=/opt/home "$img" sh -c 'env | grep -cE "^(GITHUB_|ACTIONS_|RSOLV_)" || true')" = 0
          printf '0\n' | docker run -i --rm --user 1001:118 -e HOME=/opt/home -v "$PWD/test-fixtures:/work:ro" "$img" \
            rsolv-sandbox bootstrap | tail -n1 | jq -e .ok
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-architecture index and print its digest
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ $TAG =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::$TAG is not a valid image tag"; exit 1; }
          refs=()
          for d in *; do
            [[ $d =~ ^[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest file $d"; exit 1; }
            refs+=("$IMAGE@sha256:$d")
          done
          [ "${#refs[@]}" -eq 2 ] || { echo "::error::expected 2 architecture digests, got ${#refs[@]}"; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$TAG" "${refs[@]}"
          {
            echo '```'
            docker buildx imagetools inspect "$IMAGE:$TAG"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
