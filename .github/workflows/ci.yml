name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Prepare node_modules directory
        run: |
          rm -rf node_modules
          mkdir -p node_modules

      - name: Install dependencies
        # Strict: no `|| bun install` fallback. That fallback existed to absorb
        # Dependabot PRs where the npm ecosystem updated package-lock.json but
        # not bun.lock -- it turned a lockfile violation into a green build, so
        # CI silently tested a freshly-resolved tree instead of the pinned one.
        # Dependabot now targets the bun ecosystem and package-lock.json is gone,
        # so a stale lockfile is a real problem and should fail loudly.
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:ci
        env:
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            test-report.json
            .vitest-shards/*.json
          retention-days: 30

      - name: Run type check
        run: bun run typecheck

      - name: Run lint
        run: bun run lint

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Prepare node_modules directory
        run: |
          rm -rf node_modules
          mkdir -p node_modules

      - name: Install dependencies
        # Strict: no `|| bun install` fallback. That fallback existed to absorb
        # Dependabot PRs where the npm ecosystem updated package-lock.json but
        # not bun.lock -- it turned a lockfile violation into a green build, so
        # CI silently tested a freshly-resolved tree instead of the pinned one.
        # Dependabot now targets the bun ecosystem and package-lock.json is gone,
        # so a stale lockfile is a real problem and should fail loudly.
        run: bun install --frozen-lockfile

      - name: Build Docker image
        run: docker build -t rsolv/action:latest .

      # In a real CI setup, we would push the Docker image to a registry here
