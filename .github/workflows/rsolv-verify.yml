# RSOLV v5 verify role (RFC-150 §5): prove RED→GREEN for one issue on a fresh checkout of the
# scanned commit, with the command the platform builds. Read-only token; no RSOLV secret.
# The host binary is pinned by SHA-256 below (scripts/pin-host.sh writes the pins after its
# provenance verifies); all-zero means no release is pinned yet, and the job refuses to run.
name: rsolv-verify
on:
  workflow_call:
    inputs:
      issue:
        type: number
        required: true
      api_url:
        type: string
        required: false
        default: "https://api.rsolv.ai."
      exact_runtime_versions:
        description: "Fail instead of substituting a runtime version (for example Python's newest attested patch)"
        type: boolean
        required: false
        default: false
    outputs:
      outcome:
        description: "verified, verify_failed or rejected"
        value: ${{ jobs.verify.outputs.outcome }}
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    # rsolv-host Roles.Verify's budget: 10 setup + 100 role + 10 margin.
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    outputs:
      outcome: ${{ steps.host.outputs.outcome }}
    env:
      RSOLV_HOST_VERSION: "0.1.0"
      RSOLV_HOST_SHA256_X64: "d9f0e1fd178023b0ae2b6b093aab266d8426b8bcd62f4deaa01b7e7643e65e5b"
      RSOLV_HOST_SHA256_ARM64: "40458c6beff5a956f6281586a10125e4cc137e2eb5aea0a480306a3420ae2147"
    steps:
      # The run's commit is the scanned base (RFC-150 §3); the host checks HEAD against it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: host
        name: Verify the fix (RED, then GREEN) in fresh sandboxes
        env:
          RSOLV_API_URL: ${{ inputs.api_url }}
          ISSUE: ${{ inputs.issue }}
          EXACT_RUNTIME_VERSIONS: ${{ inputs.exact_runtime_versions }}
        run: |
          # BEGIN install-host
          # Download the pinned host, check its SHA-256, and run `version` once, alone, so it
          # extracts into a fresh directory of our own before anything else runs (concurrent
          # first runs race). run_host re-checks the SHA-256 before every run and starts the
          # host with env -i and an explicit allowlist: no ERL_*, no LD_*, nothing inherited.
          set -euo pipefail
          [ "$RUNNER_OS" = Linux ] || { echo "::error title=RSOLV configuration::RSOLV runs on Linux runners only"; exit 2; }
          case "$RUNNER_ARCH" in
            X64) asset=rsolv-host-linux-x86_64 sum=$RSOLV_HOST_SHA256_X64 ;;
            ARM64) asset=rsolv-host-linux-aarch64 sum=$RSOLV_HOST_SHA256_ARM64 ;;
            *) echo "::error title=RSOLV configuration::unsupported runner architecture $RUNNER_ARCH"; exit 2 ;;
          esac
          if [[ $sum =~ ^0{64}$ ]]; then
            echo "::error title=RSOLV configuration::This rsolv-action commit pins no rsolv-host release yet (all-zero SHA-256). Use a released v5 tag of RSOLV-dev/rsolv-action."
            exit 2
          fi
          [[ $RSOLV_HOST_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $sum =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error title=RSOLV host client bug::malformed host pin"; exit 1; }
          bin="$(mktemp -d "$RUNNER_TEMP/rsolv-host-bin.XXXXXXXXXX")/rsolv-host"
          install=$(mktemp -d "$RUNNER_TEMP/rsolv-host.XXXXXXXXXX")
          home=$(mktemp -d "$RUNNER_TEMP/rsolv-host-home.XXXXXXXXXX")
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 -o "$bin" \
            "https://github.com/RSOLV-dev/rsolv-host/releases/download/host-v$RSOLV_HOST_VERSION/$asset"
          chmod 0500 "$bin"
          host_env=(PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME="$home" LANG=C.UTF-8
            RUNNER_TEMP="$RUNNER_TEMP" RSOLV_HOST_INSTALL_DIR="$install")
          job_env=(RSOLV_API_URL="$RSOLV_API_URL" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY"
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID"
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_WORKSPACE="$GITHUB_WORKSPACE"
            GITHUB_API_URL="$GITHUB_API_URL" GITHUB_GRAPHQL_URL="$GITHUB_GRAPHQL_URL"
            ACTIONS_ID_TOKEN_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL-}"
            ACTIONS_ID_TOKEN_REQUEST_TOKEN="${ACTIONS_ID_TOKEN_REQUEST_TOKEN-}")
          role_env=()
          run_host() {
            echo "$sum  $bin" | sha256sum -c --status - \
              || { echo "::error title=RSOLV sandbox setup::the rsolv-host binary does not match its pinned SHA-256"; exit 4; }
            env -i "${host_env[@]}" "${role_env[@]}" "$bin" "$@"
          }
          run_host version
          # END install-host
          role_env=("${job_env[@]}")
          [ "$EXACT_RUNTIME_VERSIONS" != true ] || role_env+=(RSOLV_EXACT_RUNTIME_VERSIONS=true)
          run_host verify --issue "$ISSUE"
