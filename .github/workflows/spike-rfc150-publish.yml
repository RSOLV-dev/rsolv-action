name: spike-rfc150-publish
on:
  workflow_call:
    inputs:
      issue: { type: string, required: true }
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write, id-token: write }
    env:
      ISSUE: ${{ inputs.issue }}
    steps:
      - id: claims
        name: Read OIDC claims (token masked, never written)
        run: |
          set -euo pipefail
          resp=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.rsolv.dev")
          token=$(jq -r .value <<<"$resp")
          echo "::add-mask::$token"
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          while (( ${#payload} % 4 )); do payload+="="; done
          base64 -d <<<"$payload" | jq '{iss, aud, sub, repository, repository_id, repository_owner, repository_owner_id, repository_visibility, run_id, run_attempt, event_name, ref, sha, workflow_ref, workflow_sha, job_workflow_ref, job_workflow_sha, runner_environment, check_run_id}' > "$RUNNER_TEMP/claims.json"
          echo "job_workflow_sha=$(jq -r .job_workflow_sha "$RUNNER_TEMP/claims.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RSOLV-dev/rsolv-action
          ref: ${{ steps.claims.outputs.job_workflow_sha }}
          path: .rsolv-vendor
          persist-credentials: false
      - name: Publish through the Git Data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .rsolv-vendor/spike/rfc150/publish-probe.mjs "$RUNNER_TEMP/publish.json"
      - name: Assemble evidence
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          jq --arg issue "$ISSUE" --slurpfile claims "$RUNNER_TEMP/claims.json" \
            '. + {role: "publish", issue: $issue, claims: $claims[0]}' "$RUNNER_TEMP/publish.json" > "$RUNNER_TEMP/evidence/evidence.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-publish-${{ inputs.issue }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/evidence.json
